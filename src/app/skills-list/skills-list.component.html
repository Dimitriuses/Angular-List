<div class="row">
    <div class="col-xs 10">
        <app-skills-edit></app-skills-edit>
        <hr>
        <h2>List</h2>
        <ul class="skills">
            <li *ngFor="let skill of skills"
              [class.selected]="skill === selectedSkill"
              (click)="onSelect(skill)">
              <span class="badge">{{skill.level}}</span> {{skill.name}}
            </li>
        </ul>
    </div>
</div>
