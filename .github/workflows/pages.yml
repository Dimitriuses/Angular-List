name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # webpack 4 (Angular 8) hashes with md4, which OpenSSL 3 refuses.
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm ci

      # Project pages serve from /<repo>/, not from /.
      - run: npx ng build --prod --base-href /Angular-List/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/eventScheduler

      - id: deployment
        uses: actions/deploy-pages@v4
